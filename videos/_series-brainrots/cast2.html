<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three new brainrots</title>
<link rel="stylesheet" href="../../engine/engine.css">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../../engine/engine.js"></script>
<script src="../../engine/look.js"></script>
<script src="../../engine/kit.js"></script>
<script src="../../engine/kit-game.js"></script>
<script src="../../engine/brainrots.js"></script>
<script>
// Brainrot series · character test 2: three new brainrots in the studio, then the whole cast of seven.
// 0–3 they arrive · 3–8 Chimpanzini Bananini · 8–13 Brr Brr Patapim · 13–18 67 · 18–24 all seven
const { clamp, smooth, lerp } = Engine;
const SHOT = [0, 3, 8, 13, 18], END = 24;
const G = Engine.game;
const SPOT = { chimpanzini: [-1.5, 0], patapim: [0, -.2], sixseven: [1.6, 0] };
const LINE = { sahur: [-3.0, .6], chimpanzini: [-2.0, .9], tralalero: [-.95, .7], patapim: [0, .2], ballerina: [1.0, .7], sixseven: [2.15, .8] }, HOVER = [0, 3.6, -2.4];
const CARDS = {
  chimpanzini: { name: 'Chimpanzini Bananini', rarity: '#e2b81e', rarityLabel: 'Brainrot', role: 'The believer', line: 'Believes everything. Twice.' },
  patapim: { name: 'Brr Brr Patapim', rarity: '#5f8a3a', rarityLabel: 'Brainrot', role: 'The grumpy one', line: 'Hates change. Loves his feet.' },
  sixseven: { name: '67', rarity: '#8a5ce8', rarityLabel: 'Brainrot', role: 'The numbers guy', line: 'Counts everything. Mostly to 67.' },
};
const person = (x, z, h, w = .45, y = 0, d = w) => [[x - w, y, z], [x + w, y, z], [x, y + h, z], [x, y, z + d], [x, y, z - d], [x - w, y + h*.6, z], [x + w, y + h*.6, z]];
const CAMS = [
  G.fit([...person(...SPOT.chimpanzini, 1.35), ...person(...SPOT.patapim, 1.8), ...person(...SPOT.sixseven, 1.6, .8)], { yaw: Math.PI, pitch: -.03, fov: 32, top: .2, bottom: .7 }),
  G.fit(person(...SPOT.chimpanzini, 1.75, .6), { yaw: Math.PI - .15, pitch: -.04, fov: 30 }),
  G.fit(person(...SPOT.patapim, 1.85, .55), { yaw: Math.PI + .2, pitch: -.03, fov: 30 }),
  G.fit(person(...SPOT.sixseven, 1.65, .85, 0, .6), { yaw: Math.PI - .25, pitch: -.03, fov: 30 }),
  G.fit([...Object.values(LINE).flatMap(([x, z]) => person(x, z, 1.75, .5)), [HOVER[0] - 1.9, HOVER[1], HOVER[2]], [HOVER[0] + 1.9, HOVER[1], HOVER[2]], [0, HOVER[1] + .7, HOVER[2]]], { yaw: Math.PI, pitch: -.03, fov: 32, top: .2, bottom: .72 }),
];
function camAt(t){
  let i = 0; while (i < SHOT.length - 1 && t >= SHOT[i+1]) i++;
  const a = CAMS[i], u = smooth(SHOT[i], SHOT[i+1] ?? END, t), pos = a.pos.slice(), look = a.look.slice();
  pos[2] += (1 - u)*.12*a.dist; look[2] += (1 - u)*.12*a.dist;
  return { pos, look, fov: a.fov };
}

Engine.game.fonts().then(() => Engine.create({
  title: 'Three new <em>brainrots</em>',
  hud: 'editorial',
  ariaLabel: 'Three new brainrot characters arrive in a studio, show off, then line up with the rest of the cast',
  duration: END, tail: .6, seed: 12,
  fog: [200, 900], fov: 32, far: 900,
  look: { vignette: 0, grain: 0, exposure: .9, saturation: 1.12, contrast: 1.06, env: .3, bloom: { strength: .25, radius: .4, threshold: 1.6 } },
  sound: true,

  setup(ctx){
    const { THREE, scene } = ctx, c = ctx.col, B = Engine.fx.brainrot;
    ctx.camera.near = .05; ctx.camera.updateProjectionMatrix();
    const prof = []; for (let i = 0; i <= 60; i++){ const u = i/60, z0 = 40 - u*48;
      if (z0 > -6) prof.push([z0, 0]); else { const a = Math.min(1, (-6 - z0)/12.6)*Math.PI/2; prof.push([-6 - Math.sin(a)*8, 8*(1 - Math.cos(a))]); } }
    for (let y = 9; y <= 60; y += 3) prof.push([-14, y]);
    const W = 120, pos = [], col = [], idx = [], lo = c('#8a7fc6'), hi = c('#463a94'), tc = new THREE.Color();
    prof.forEach(([z, y]) => { for (const x of [-W/2, 0, W/2]){ pos.push(x, y, z); tc.copy(lo).lerp(hi, smooth(0, 30, y + Math.max(0, -z - 6)*.6)); col.push(tc.r, tc.g, tc.b); } });
    for (let i = 0; i < prof.length - 1; i++) for (let k = 0; k < 2; k++){ const a = i*3 + k, b = a + 1, d = a + 3, e = a + 4; idx.push(a, d, b, b, d, e); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
    const cyc = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, envMapIntensity: .3, side: THREE.DoubleSide })); cyc.receiveShadow = true; cyc.position.y = -.08; scene.add(cyc);
    const stage = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.75, .12, 64), new THREE.MeshStandardMaterial({ color: c('#b9b0e0'), roughness: .6 }));
    stage.position.y = -.06; stage.receiveShadow = true; scene.add(stage);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.62, .045, 8, 96), new THREE.MeshBasicMaterial({ color: c('#ffffff') })); ring.rotation.x = Math.PI/2; ring.position.y = .01; scene.add(ring);
    const ch = { chimpanzini: B(ctx, 'chimpanzini'), patapim: B(ctx, 'patapim'), sixseven: B(ctx, 'sixseven'),
      sahur: B(ctx, 'sahur', { height: 1.5 }), tralalero: B(ctx, 'tralalero'), ballerina: B(ctx, 'ballerina'), bombardiro: B(ctx, 'bombardiro') };
    const tr = {
      chimpanzini: B.track([{ t: 0, x: -6.5, z: 1.2 }, { t: 2.6, x: SPOT.chimpanzini[0], z: SPOT.chimpanzini[1] }, { t: 3, x: SPOT.chimpanzini[0], z: SPOT.chimpanzini[1], yaw: 0 },
        { t: 18, x: SPOT.chimpanzini[0], z: SPOT.chimpanzini[1], yaw: 0 }, { t: 19.6, x: LINE.chimpanzini[0], z: LINE.chimpanzini[1] }, { t: 20, x: LINE.chimpanzini[0], z: LINE.chimpanzini[1], yaw: 0 }]),
      patapim: B.track([{ t: 0, x: 0, z: -5.5 }, { t: .3, x: 0, z: -5.5 }, { t: 2.8, x: SPOT.patapim[0], z: SPOT.patapim[1] }, { t: 3.1, x: SPOT.patapim[0], z: SPOT.patapim[1], yaw: 0 },
        { t: 9.0, x: SPOT.patapim[0], z: SPOT.patapim[1], yaw: 0 }, { t: 10.6, x: 0, z: 1.2 }, { t: 11, x: 0, z: 1.2, yaw: 0 }, { t: 18, x: 0, z: 1.2, yaw: 0 }, { t: 19.6, x: LINE.patapim[0], z: LINE.patapim[1] }, { t: 20, x: LINE.patapim[0], z: LINE.patapim[1], yaw: 0 }]),
      sixseven: B.track([{ t: 0, x: 6.5, z: 1.0 }, { t: 2.7, x: SPOT.sixseven[0], z: SPOT.sixseven[1] }, { t: 3.1, x: SPOT.sixseven[0], z: SPOT.sixseven[1], yaw: 0 },
        { t: 18, x: SPOT.sixseven[0], z: SPOT.sixseven[1], yaw: 0 }, { t: 19.6, x: LINE.sixseven[0], z: LINE.sixseven[1] }, { t: 20, x: LINE.sixseven[0], z: LINE.sixseven[1], yaw: 0 }]),
      sahur: B.track([{ t: 0, x: -7, z: -1 }, { t: 17.6, x: -7, z: -1 }, { t: 20, x: LINE.sahur[0], z: LINE.sahur[1] }, { t: 20.4, x: LINE.sahur[0], z: LINE.sahur[1], yaw: 0 }]),
      tralalero: B.track([{ t: 0, x: -6.5, z: 3.5 }, { t: 17.4, x: -6.5, z: 3.5 }, { t: 19.8, x: LINE.tralalero[0], z: LINE.tralalero[1] }, { t: 20.2, x: LINE.tralalero[0], z: LINE.tralalero[1], yaw: 0 }]),
      ballerina: B.track([{ t: 0, x: 7, z: 3 }, { t: 17.5, x: 7, z: 3 }, { t: 20.1, x: LINE.ballerina[0], z: LINE.ballerina[1] }, { t: 20.5, x: LINE.ballerina[0], z: LINE.ballerina[1], yaw: 0 }]),
      bombardiro: B.track([{ t: 0, x: 0, z: -40, y: 12 }, { t: 17.5, x: 0, z: -40, y: 12 }, { t: 20.4, x: HOVER[0], z: HOVER[2] - .6, y: HOVER[1] + .1 }, { t: 20.9, x: HOVER[0], z: HOVER[2], y: HOVER[1], yaw: .6 }]),
    };
    const cards = {}; for (const k in CARDS) cards[k] = G.card(ctx, CARDS[k]);
    return { ch, tr, cards, ring };
  },

  update(ctx, t, dt){
    const S = ctx.state, cam = camAt(t), c = ctx.col;
    ctx.camera.position.set(...cam.pos); ctx.camera.lookAt(...cam.look);
    if (ctx.camera.fov !== cam.fov){ ctx.camera.fov = cam.fov; ctx.camera.updateProjectionMatrix(); }
    ctx.aimSun(0, 0, [-14, 22, 18]); ctx.look.setSky(c('#9d93d2'), c('#5a4fa8')); ctx.sun.intensity = 1.9;
    const camV = new THREE.Vector3(...cam.pos), shot = SHOT.filter(s => t >= s).length - 1, all = smooth(20.6, 21, t);
    const place = k => { const p = S.tr[k](t), o = S.ch[k].object; o.position.set(p.x, 0, p.z); o.rotation.y = p.yaw; return p; };
    { const p = place('chimpanzini'); S.ch.chimpanzini.update(t, { speed: p.speed, look: p.moving ? null : camV, cheer: smooth(4, 4.3, t)*(1 - smooth(6.4, 6.8, t)) + all,
        laugh: smooth(6.6, 6.9, t)*(1 - smooth(7.8, 8, t)), surprise: smooth(2.9, 3.1, t)*(1 - smooth(3.6, 3.9, t)), jump: .2*Math.max(0, Math.sin(clamp((t - 5.2)/.45, 0, 1)*Math.PI)) + .15*Math.max(0, Math.sin(clamp((t - 21.2)/.45, 0, 1)*Math.PI)) }); }
    { const p = place('patapim'); S.ch.patapim.update(t, { speed: p.speed, look: p.moving ? null : camV, shiver: smooth(11.2, 11.4, t)*(1 - smooth(12.4, 12.7, t)) + .6*smooth(21, 21.2, t)*(1 - smooth(22, 22.3, t)),
        surprise: smooth(12.7, 12.9, t)*(1 - smooth(13.4, 13.7, t)) }); }
    { const p = place('sixseven'); S.ch.sixseven.update(t, { speed: p.speed, look: p.moving ? null : camV, sixseven: smooth(14.2, 14.5, t)*(1 - smooth(17.4, 17.8, t)) + all, surprise: smooth(13.2, 13.4, t)*(1 - smooth(13.8, 14.1, t)) }); }
    { const p = place('sahur'); S.ch.sahur.update(t, { speed: p.speed, look: camV, raise: all }); }
    { const p = place('tralalero'); S.ch.tralalero.update(t, { speed: p.speed, look: p.moving ? null : camV, chomp: smooth(21.2, 21.4, t)*(1 - smooth(22, 22.2, t)) }); }
    { const p = place('ballerina'); S.ch.ballerina.update(t, { speed: p.speed, arms: .2 + .8*all }); }
    { const p = S.tr.bombardiro(t), o = S.ch.bombardiro.object; o.position.set(p.x, 0, p.z); o.rotation.y = p.yaw; S.ch.bombardiro.update(t, { alt: p.y, bombs: 2, prop: 1, chomp: smooth(21.4, 21.6, t)*(1 - smooth(22.2, 22.4, t)) }); }
    for (const k in S.cards){ const i = ['chimpanzini', 'patapim', 'sixseven'].indexOf(k) + 1, t0 = SHOT[i]; S.cards[k].set(smooth(t0 + .5, t0 + .9, t)*(1 - smooth(t0 + 4.4, t0 + 4.8, t))); }
    const who = ['chimpanzini', 'patapim', 'sixseven'][shot - 1];
    S.ring.material.color.copy(c(who ? CARDS[who].rarity : '#ffffff')).multiplyScalar(1.4);
    for (const s of SHOT.slice(1)) if (t >= s && t - dt < s) ctx.audio.hit('whoosh', { strength: .3 });
    for (const k of [14.6, 15.5, 16.4, 17.3]) if (t >= k && t - dt < k) ctx.audio.hit('knock', { pitch: 1.4, ring: .2, strength: .4 });
    ctx.audio.set('hum', .1*smooth(18, 21, t));
    return {};
  },
}));
</script>
</body>
</html>

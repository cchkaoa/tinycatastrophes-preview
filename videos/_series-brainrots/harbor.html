<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The beach and the harbor</title>
<link rel="stylesheet" href="../../engine/engine.css">
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../../engine/engine.js"></script>
<script src="../../engine/look.js"></script>
<script src="../../engine/kit.js"></script>
<script src="../../engine/kit-game.js"></script>
<script src="../../engine/brainrots.js"></script>
<script src="../../engine/sets.js"></script>
<script>
// Brainrot series · set test: the beach and the harbour (Engine.fx.set 'harbor'), a toy diorama on a floating island.
// 0–5 the island · 5–10 the beach from the water: Tralalero walks out of the sea · 10–15 the harbour: Sahur down the
// pier, Ballerina on the jetty · 15–22 the sun goes down, the lighthouse comes on
const { clamp, smooth, lerp } = Engine;
const SHOT = [0, 5, 10, 15], END = 22;
const G = Engine.game;
const ISLAND = [[-14.2, 0, -14.2], [14.2, 0, -14.2], [-14.2, 0, 14.2], [14.2, 0, 14.2], [-9.6, 9.6, 9.4], [0, -10.2, 0], [0, -6, 10], [0, -6, -10], [10, -6, 0], [-10, -6, 0], [12, 7.5, -10]];

Engine.game.fonts().then(() => Engine.create({
  title: 'The <em>harbor</em>',
  hud: 'editorial',
  ariaLabel: 'A toy beach and harbour on a floating island: a lighthouse, boats, a pier, the brainrot cast',
  duration: END, tail: .6, seed: 12,
  fog: [220, 900], fov: 32, far: 900,
  look: { vignette: 0, grain: 0, exposure: .95, saturation: 1.1, contrast: 1.05, env: .3, bloom: { strength: .3, radius: .45, threshold: 1.4 } },
  sound: true, samples: ['water/sea-waves', 'nature/birds-morning'],

  setup(ctx){
    const B = Engine.fx.brainrot;
    ctx.camera.near = .1; ctx.camera.updateProjectionMatrix();
    Object.assign(ctx.sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 120 }); ctx.sun.shadow.camera.updateProjectionMatrix();
    const set = Engine.fx.set(ctx, 'harbor'), sp = set.spots;
    const ch = { sahur: B(ctx, 'sahur', { height: 1.5 }), tralalero: B(ctx, 'tralalero'), ballerina: B(ctx, 'ballerina') };
    const tr = {
      tralalero: B.track([{ t: 0, x: -2.6, z: 10.5 }, { t: 5.4, x: -2.6, z: 10.5 }, { t: 9.6, x: -3.4, z: -.8 }, { t: 10.0, x: -3.4, z: -.8, yaw: Math.PI*.15 }]),
      sahur: B.track([{ t: 0, x: 13.6, z: -6.6 }, { t: 9.5, x: 13.6, z: -6.6 }, { t: 11.2, x: sp.pier.start[0], z: sp.pier.start[1] + .4 }, { t: 14.6, x: sp.pier.end[0], z: sp.pier.end[2] }, { t: 15, x: sp.pier.end[0], z: sp.pier.end[2], yaw: -.6 }]),
      ballerina: B.track([{ t: 0, x: sp.jetty.start[0], z: sp.jetty.start[1] }, { t: 9.8, x: sp.jetty.start[0], z: sp.jetty.start[1] }, { t: 14.5, x: sp.jetty.end[0], z: sp.jetty.end[2] }, { t: 14.9, x: sp.jetty.end[0], z: sp.jetty.end[2], yaw: .5 }]),
    };
    return { set, ch, tr };
  },

  update(ctx, t, dt){
    const S = ctx.state, c = ctx.col, set = S.set, sp = set.spots;
    const shot = SHOT.filter(s => t >= s).length - 1, u = smooth(SHOT[shot], SHOT[shot + 1] ?? END, t);
    let pos, look;
    if (shot === 0){ const f = G.fit(ISLAND, { yaw: Math.PI - .55 + .45*u, pitch: -.24, fov: 32, top: .3, bottom: .88 }); pos = f.pos; look = f.look; }
    else if (shot === 1){ pos = [lerp(-1.2, -2.2, u), lerp(1.5, 1.1, u), lerp(13.6, 12.4, u)]; look = [-3.6, 1.6, -3]; }
    else if (shot === 2){ pos = [lerp(13.2, 12.6, u), 2.8, lerp(11.0, 10.2, u)]; look = [6.8, 1.3, .5]; }
    else { const a = .1 + .3*u; pos = [Math.sin(a)*26 - 2, 8 - 2*u, Math.cos(a)*26]; look = [-4.5, 2.5, 2]; }
    ctx.camera.position.set(...pos); ctx.camera.lookAt(...look);
    ctx.aimSun(0, 0, [-16, 26, 20]);
    const night = smooth(17.5, 21, t), dusk = Math.sin(Math.PI*clamp((t - 15.5)/4, 0, 1));
    ctx.look.setSky(c('#d4ebf7').lerp(c('#f0a37a'), dusk*.8).lerp(c('#3b3f7a'), night), c('#78b2e8').lerp(c('#5a6fc0'), dusk*.6).lerp(c('#141a3e'), night));
    ctx.sun.intensity = 1.9*(1 - .85*night); ctx.sun.color.copy(c('#ffffff').lerp(c('#ffb27a'), dusk*.7));
    ctx.hemi.intensity = .78*(1 - .7*night); ctx.hemi.color.copy(c('#fff0da').lerp(c('#8fa0e0'), night));
    set.update(t, { wind: .45, night, waves: .5, scatter: Math.max(0, t - 9.0) });
    const camV = new THREE.Vector3(...pos);
    for (const k of ['tralalero', 'sahur', 'ballerina']){ const p = S.tr[k](t), o = S.ch[k].object; o.position.set(p.x, set.ground(p.x, p.z), p.z); o.rotation.y = p.yaw;
      S.ch[k].update(t, { speed: p.speed, look: p.moving ? null : camV, ...(k === 'tralalero' ? { chomp: smooth(10.2, 10.4, t)*(1 - smooth(11.2, 11.4, t)) } : k === 'ballerina' ? { arms: .2 + .7*smooth(14.8, 15.3, t) } : { raise: smooth(15, 15.4, t) }) }); }
    ctx.audio.set('water/sea-waves', .45); ctx.audio.set('nature/birds-morning', .15*(1 - night));
    for (const s of SHOT.slice(1)) if (t >= s && t - dt < s) ctx.audio.hit('whoosh', { strength: .3 });
    return {};
  },
}));
</script>
</body>
</html>
